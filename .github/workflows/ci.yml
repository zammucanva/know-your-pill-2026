name: KYP CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/ci.db
      SESSION_SECRET: kyp-ci-only-session-secret-0123456789abcdef0123456789abcdef
      TRUSTED_PROXY_HEADERS: "1"
      EMAIL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run osv
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:content-lock
      - run: bun run build
      - run: bun run build:export
      - run: bun test tests/
