name: KYP CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Disposable Postgres for the test suite (the schema is PostgreSQL; the
    # harness refuses to run against anything but a local "*test*" database).
    services:
      postgres:
        # Pinned to an exact version and the Docker Hub index digest for it (read from the Docker Hub API; not pulled here).
        image: postgres:16.9@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kyp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kyp_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/kyp_test
      SESSION_SECRET: kyp-ci-only-session-secret-0123456789abcdef0123456789abcdef
      TRUSTED_PROXY_HEADERS: "1"
      EMAIL_PROVIDER: mock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bunx prisma generate
      - run: bun run osv
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:content-lock
      - run: bun run lint:dashes
      - run: bun run audit:four-mode
      - run: bun run build
      - run: bun test tests/
      - run: bun run build:export
