name: KYP CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Disposable Postgres for the test suite (the schema is PostgreSQL; the
    # harness refuses to run against anything but a local "*test*" database).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kyp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kyp_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/kyp_test
      SESSION_SECRET: kyp-ci-only-session-secret-0123456789abcdef0123456789abcdef
      TRUSTED_PROXY_HEADERS: "1"
      EMAIL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run osv
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:content-lock
      - run: bun run build
      - run: bun test tests/
      - run: bun run build:export
